<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Optimization Analytics | Parameter Input</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .card { 
            background: #ffffff; 
            width: 100%;
            max-width: 650px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            padding: 40px;
        }
        .header { margin-bottom: 28px; border-bottom: 2px solid #f1f5f9; padding-bottom: 16px; }
        .header h2 { font-size: 24px; font-weight: 700; color: #0f172a; }
        .header p { font-size: 14px; color: #64748b; margin-top: 6px; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .form-group { display: flex; flex-direction: column; }
        label { 
            font-size: 13px; 
            font-weight: 600; 
            color: #334155; 
            margin-bottom: 8px; 
            letter-spacing: 0.3px;
        }
        input { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 15px; 
            color: #0f172a;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }
        input:focus { 
            outline: none; 
            border-color: #2563eb; 
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
        }
        .submit-btn { 
            margin-top: 10px;
            width: 100%;
            padding: 14px; 
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); 
            color: #ffffff; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .submit-btn:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>Logistics Route Parameters</h2>
            <p>Specify operational variables to generate AI-driven route selection decisions.</p>
        </div>

        <form method="POST" action="/predict" class="form-grid">
            {% for feat in feature_names %}
            <div class="form-group">
                <label>{{ feat.replace('_', ' ').title() }}</label>
                <input type="number" step="any" name="{{ feat }}" required placeholder="Enter {{ feat.replace('_', ' ') }}" value="0">
            </div>
            {% endfor %}
            
            <button type="submit" class="submit-btn">Run Route Optimization AI</button>
        </form>
    </div>

</body>
</html>
